name: 编剧部 starter（公开版）
description: cordis-plugin-novelist 配套编辑部预设（两座位制）：主编=常驻主智能体（三段式人格：资深责任编辑/连载场域/纪律清单含裁量条款——guide 流程=缺省轨道可偏离须留痕、红线不可偏离）+主笔=作者+执笔一体（署名提案+亲自执笔、章内两段式=提案→Owner 门→同会话续写、continuable 同事线、个体参照制+反套路义务+发散常态 2-3 候选）；按需工种（一次性不占编制）=档案员/拆书员/试读员/校准员/校对员；novelist 十二工具（三原语 novel_ask/novel_chapter 派生/novel_decide；纯文件账本+事件带+判据账；判据降权=量表只守门）+卷级 ask 门。章长窗默认 3000-4000·日节奏 6 章/批。使用前提=先装插件（dsh plugin add cordis-plugin-novelist），装法见 preset-starter/README.md。
order: 6
